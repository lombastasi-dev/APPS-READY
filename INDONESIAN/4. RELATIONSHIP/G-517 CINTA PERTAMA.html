<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panduan Cinta Pertama™ — Belajar Cinta Tanpa Kehilangan Diri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #FEF0FF 0%, #FFF0F3 100%); color: #2D3748; min-height: 100vh; display: flex; flex-direction: column; }
    .app-container { display: flex; flex: 1; position: relative; }

    .sidebar { width: 260px; background: #FFFFFF; box-shadow: 2px 0 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; transition: transform 0.3s ease; }
    .sidebar-header { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F0F0F0; }
    .sidebar-header i { font-size: 24px; color: #9B5DE5; }
    .sidebar-header h1 { font-size: 18px; font-weight: 700; color: #1A202C; background: linear-gradient(45deg, #9B5DE5, #F15BB5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-list { list-style: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; background: none; border-radius: 12px; color: #4A5568; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.2s ease; }
    .nav-item button:hover { background: #F7FAFC; color: #9B5DE5; }
    .nav-item button.active { background: #F3E8FF; color: #9B5DE5; font-weight: 600; }
    .nav-item button i { font-size: 16px; width: 20px; text-align: center; }

    .mobile-header { display: none; height: 60px; background: #FFFFFF; padding: 0 20px; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
    .mobile-header .brand { font-weight: 700; font-size: 16px; color: #9B5DE5; display: flex; align-items: center; gap: 8px; }
    .hamburger { background: none; border: none; font-size: 20px; color: #4A5568; cursor: pointer; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 95; }

    .main-content { flex: 1; margin-left: 260px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }

    .card { background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.8); }
    .hero-card { background: linear-gradient(135deg, #FFFFFF 0%, #FAF5FF 100%); border: 1px solid #F3E8FF; text-align: center; padding: 36px 24px; }
    .hero-card h2 { font-size: 28px; font-weight: 700; color: #1A202C; margin-bottom: 8px; }
    .hero-card p { color: #718096; font-size: 16px; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .tool-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .tool-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(155,93,229,0.1); }
    .icon-wrapper { width: 48px; height: 48px; border-radius: 12px; background: #F3E8FF; color: #9B5DE5; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .tool-card h3 { font-size: 18px; font-weight: 600; color: #2D3748; }
    .tool-card p { font-size: 13px; color: #718096; line-height: 1.4; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .form-group label { font-weight: 600; font-size: 14px; color: #4A5568; }
    input[type="text"], textarea, select { width: 100%; padding: 12px 16px; border: 1px solid #E2E8F0; border-radius: 10px; font-family: inherit; font-size: 14px; color: #2D3748; background: #F8FAFC; transition: all 0.2s; }
    input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: #9B5DE5; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(155,93,229,0.15); }
    textarea { resize: vertical; min-height: 80px; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .radio-option { position: relative; }
    .radio-option input { position: absolute; opacity: 0; cursor: pointer; }
    .radio-label { display: block; padding: 8px 16px; background: #F7FAFC; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 13px; font-weight: 500; color: #4A5568; cursor: pointer; transition: all 0.2s; }
    .radio-option input:checked + .radio-label { background: #F3E8FF; border-color: #9B5DE5; color: #9B5DE5; font-weight: 600; }

    .btn { padding: 12px 20px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(45deg, #9B5DE5, #F15BB5); color: white; box-shadow: 0 4px 12px rgba(155,93,229,0.25); }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-secondary { background: #EDF2F7; color: #4A5568; }
    .btn-secondary:hover { background: #E2E8F0; }
    .btn-copy { background: #F3E8FF; color: #9B5DE5; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-copy:hover { background: #E9D5FF; }
    .btn-row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }

    .output-card { margin-top: 24px; display: flex; flex-direction: column; gap: 20px; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .banner { padding: 16px; border-radius: 12px; font-weight: 700; font-size: 18px; text-align: center; letter-spacing: 0.5px; }
    .banner-green { background: #DEF7EC; color: #03543F; }
    .banner-yellow { background: #FEF08A; color: #713F12; }
    .banner-red { background: #FDE8E8; color: #9B1C1C; }
    .banner-orange { background: #FFEDD5; color: #9A3412; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
    .badge-low { background: #E2E8F0; color: #4A5568; }
    .badge-medium { background: #FEF08A; color: #713F12; }
    .badge-high { background: #DEF7EC; color: #03543F; }

    .result-section { border-bottom: 1px solid #F0F0F0; padding-bottom: 16px; }
    .result-section:last-child { border-bottom: none; padding-bottom: 0; }
    .result-title { font-size: 12px; font-weight: 700; color: #A0AEC0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .result-body { font-size: 14px; color: #2D3748; line-height: 1.5; }
    
    .script-box { background: #F8FAFC; border-left: 4px solid #9B5DE5; padding: 12px 16px; border-radius: 0 8px 8px 0; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 12px; }
    .script-text { font-size: 14px; color: #2D3748; font-style: italic; word-break: break-word; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .history-section { margin-top: 32px; }
    .accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; border-top: 1px solid #E2E8F0; font-weight: 600; font-size: 14px; color: #4A5568; }
    .accordion-content { display: none; padding: 12px 0; }
    .accordion-content.active { display: flex; flex-direction: column; gap: 12px; }
    .history-item { background: #F8FAFC; padding: 12px; border-radius: 8px; font-size: 13px; border: 1px solid #EDF2F7; }
    .history-timestamp { font-size: 11px; color: #A0AEC0; margin-bottom: 4px; }

    .reset-progress { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
    .reset-day { background: #F3E8FF; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; color: #9B5DE5; }
    .reset-day.done { background: #9B5DE5; color: white; }

    footer { text-align: center; padding: 24px; color: #718096; font-size: 12px; margin-top: auto; line-height: 1.5; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #2D3748; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; z-index: 1000; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .mobile-header { display: flex; }
      .main-content { margin-left: 0; padding: 20px 16px; }
      .overlay.show { display: block; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="mobile-header">
    <div class="brand"><i class="fa-solid fa-heart"></i> PanduanCinta™</div>
    <button class="hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div class="overlay" id="overlay"></div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-heart"></i>
        <h1>PanduanCinta™</h1>
      </div>
      <ul class="nav-list">
        <li class="nav-item"><button class="nav-btn active" data-tool="dashboard"><i class="fa-solid fa-house"></i> Beranda</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="text-decoder"><i class="fa-solid fa-message"></i> Dekoder Pesan</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="should-text"><i class="fa-solid fa-paper-plane"></i> Haruskah Aku Mengetik?</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="the-talk"><i class="fa-solid fa-comments"></i> Pembicaraan</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="jealousy-reset"><i class="fa-solid fa-shield-halved"></i> Reset Kecemburuan</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="fight-fixer"><i class="fa-solid fa-handshake"></i> Perbaiki Pertengkaran</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="reset"><i class="fa-solid fa-rotate"></i> Reset 7 Hari</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="plan"><i class="fa-solid fa-list-check"></i> Rencana Hubunganku</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="history"><i class="fa-solid fa-clock-rotate-left"></i> Riwayatku</button></li>
        <li class="nav-item"><button class="nav-btn" data-tool="privacy"><i class="fa-solid fa-lock"></i> Privasi & Keamanan</button></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="container" id="contentArea"></div>
      <footer>Untuk hiburan semata. Bukan nasihat profesional. Jika kamu dalam krisis, bicaralah dengan seseorang yang kamu percaya.</footer>
    </main>
  </div>

  <div class="toast" id="toast">Disalin!</div>

  <script>
    /* ===== STATE & STORAGE ===== */
    function getHistory(toolId) {
      try { return JSON.parse(localStorage.getItem(`flg_history_${toolId}`) || '[]'); } catch { return []; }
    }
    function setHistory(toolId, item) {
      let h = getHistory(toolId);
      h.unshift({ ...item, timestamp: new Date().toLocaleString('id-ID') });
      if (h.length > 30) h = h.slice(0, 30);
      localStorage.setItem(`flg_history_${toolId}`, JSON.stringify(h));
    }
    function clearHistory(toolId) {
      localStorage.removeItem(`flg_history_${toolId}`);
      renderTool(toolId);
    }
    function clearAllHistory() {
      ['text-decoder','should-text','the-talk','jealousy-reset','fight-fixer','reset'].forEach(id => localStorage.removeItem(`flg_history_${id}`));
      renderTool('history');
      showToast('Semua riwayat dihapus');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
    function copyToClipboard(text) {
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('Disalin!')).catch(() => fallbackCopy(text));
      else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Disalin!');
    }

    /* ===== NAVIGASI ===== */
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
    hamburgerBtn.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);

    function switchTool(toolId) {
      closeSidebar();
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === toolId));
      renderTool(toolId);
    }
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTool(btn.dataset.tool));
    });

    /* ===== MESIN RENDER ===== */
    function renderTool(toolId) {
      const container = document.getElementById('contentArea');
      switch (toolId) {
        case 'dashboard': container.innerHTML = renderDashboard(); break;
        case 'text-decoder': container.innerHTML = renderTextDecoder(); break;
        case 'should-text': container.innerHTML = renderShouldText(); break;
        case 'the-talk': container.innerHTML = renderTheTalk(); break;
        case 'jealousy-reset': container.innerHTML = renderJealousyReset(); break;
        case 'fight-fixer': container.innerHTML = renderFightFixer(); break;
        case 'reset': container.innerHTML = renderReset(); break;
        case 'plan': container.innerHTML = renderPlan(); break;
        case 'history': container.innerHTML = renderHistoryView(); break;
        case 'privacy': container.innerHTML = renderPrivacy(); break;
        default: container.innerHTML = renderDashboard();
      }
      window.scrollTo(0, 0);
    }

    function renderHistoryAccordion(toolId, history, label) {
      if (!history || history.length === 0) return '';
      return `
        <div class="history-section">
          <div class="accordion-header" onclick="toggleAccordion('${toolId}')">
            <span><i class="fa-solid fa-clock-rotate-left"></i> ${label} Sebelumnya (${history.length})</span>
            <i class="fa-solid fa-chevron-down" id="accIcon-${toolId}"></i>
          </div>
          <div class="accordion-content" id="accContent-${toolId}">
            <button class="btn btn-secondary" style="font-size:12px;padding:4px 8px;align-self:flex-end;" onclick="clearHistory('${toolId}')">Hapus Riwayat</button>
            ${history.map(item => `
              <div class="history-item">
                <div class="history-timestamp">${item.timestamp}</div>
                <div><strong>${item.summary}</strong></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleAccordion(toolId) {
      const content = document.getElementById(`accContent-${toolId}`);
      const icon = document.getElementById(`accIcon-${toolId}`);
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        icon.className = 'fa-solid fa-chevron-down';
      } else {
        content.classList.add('active');
        icon.className = 'fa-solid fa-chevron-up';
      }
    }

    /* ===== BERANDA ===== */
    function renderDashboard() {
      return `
        <div class="card hero-card">
          <h2>Panduan Cinta Pertama™</h2>
          <p>Hubungan serius pertamamu tidak datang dengan buku panduan. Ini adalah panduan lapanganmu.</p>
        </div>
        <div class="dashboard-grid">
          <div class="card tool-card" onclick="switchTool('text-decoder')">
            <div class="icon-wrapper"><i class="fa-solid fa-message"></i></div>
            <h3>Dekoder Pesan</h3>
            <p>Bedah pesan ambigu, pahami nada, dan hindari berpikir berlebihan.</p>
          </div>
          <div class="card tool-card" onclick="switchTool('should-text')">
            <div class="icon-wrapper"><i class="fa-solid fa-paper-plane"></i></div>
            <h3>Haruskah Aku Mengetik?</h3>
            <p>Dapatkan putusan jelas tentang menghubungi tanpa mengirim dua kali atau panik.</p>
          </div>
          <div class="card tool-card" onclick="switchTool('the-talk')">
            <div class="icon-wrapper"><i class="fa-solid fa-comments"></i></div>
            <h3>Pembicaraan</h3>
            <p>Naskah dan strategi untuk mendefinisikan hubungan dengan percaya diri.</p>
          </div>
          <div class="card tool-card" onclick="switchTool('jealousy-reset')">
            <div class="icon-wrapper"><i class="fa-solid fa-shield-halved"></i></div>
            <h3>Reset Kecemburuan</h3>
            <p>Pisahkan fakta dari asumsi saat media sosial memicu kecemasan.</p>
          </div>
          <div class="card tool-card" onclick="switchTool('fight-fixer')">
            <div class="icon-wrapper"><i class="fa-solid fa-handshake"></i></div>
            <h3>Perbaiki Pertengkaran</h3>
            <p>Hadapi pertengkaran besar pertamamu dengan anggun dan perbaiki secara efektif.</p>
          </div>
        </div>
      `;
    }

    /* ===== DEKODER PESAN ===== */
    function renderTextDecoder() {
      const h = getHistory('text-decoder');
      return `
        <div class="card">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Dekoder Pesan</h2>
          <p style="color:#718096;font-size:14px;margin-bottom:20px;">Apa sebenarnya arti pesan ini?</p>
          <div class="form-group">
            <label for="decoderText">Tempelkan pesan di sini:</label>
            <textarea id="decoderText" placeholder="Misal: 'k.', 'Baiklah', 'Aku baru saja sangat sibuk akhir-akhir ini...'"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="processTextDecoder()"><i class="fa-solid fa-magnifying-glass"></i> Dekode</button>
            <button class="btn btn-secondary" onclick="loadSampleTextDecoder()">Muat Contoh</button>
          </div>
        </div>
        <div id="decoderOutput"></div>
        ${renderHistoryAccordion('text-decoder', h, 'Dekode')}
      `;
    }

    function loadSampleTextDecoder() {
      document.getElementById('decoderText').value = 'k.';
    }

    function processTextDecoder() {
      const text = document.getElementById('decoderText').value.trim();
      if (!text) return;
      const lower = text.toLowerCase();
      let tone = "Netral / Tidak Jelas";
      let interpretations = [];
      if (lower === "k" || lower === "k.") {
        tone = "Sangat Singkat / Berpotensi Meremehkan";
        interpretations = [
          { text: "Mereka sedang terburu-buru atau multitasking dan mengirimkan pengakuan cepat.", conf: "Tinggi" },
          { text: "Mereka merasa sedikit kesal atau pasif-agresif tentang pesan sebelumnya.", conf: "Sedang" },
          { text: "Mereka benar-benar menganggap 'k' sebagai respons netral yang dapat diterima.", conf: "Rendah" }
        ];
      } else if (lower.includes("sibuk")) {
        tone = "Sopan / Meminta Maaf / Jauh";
        interpretations = [
          { text: "Mereka benar-benar kewalahan dengan tugas dunia nyata (pekerjaan, sekolah, kehidupan).", conf: "Tinggi" },
          { text: "Mereka menetapkan batasan lunak untuk memperlambat laju komunikasi.", conf: "Sedang" },
          { text: "Mereka tidak memiliki energi untuk percakapan mendalam saat ini.", conf: "Sedang" }
        ];
      } else {
        tone = text.length < 10 ? "Pendek / Langsung" : "Detail / Ekspresif";
        interpretations = [
          { text: "Mereka benar-benar bermakna persis seperti yang mereka katakan.", conf: "Tinggi" },
          { text: "Mereka menyesuaikan dengan energi atau nada dari percakapan sebelumnya.", conf: "Sedang" },
          { text: "Mereka secara halus memberi sinyal suasana hati atau ketersediaan mereka saat ini.", conf: "Rendah" }
        ];
      }
      const casual = "Tidak masalah sama sekali! Ngobrol nanti saat kamu senggang.";
      const warm = "Semoga harimu menyenangkan! Beri tahu aku jika kamu butuh sesuatu.";
      const space = "Baik! Santai saja.";
      
      const html = `
        <div class="card output-card">
          <div class="result-section"><div class="result-title">Makna Harfiah</div><div class="result-body">Pengirim mengirimkan: "${text}"</div></div>
          <div class="result-section"><div class="result-title">Analisis Nada</div><div class="result-body"><strong>${tone}</strong></div></div>
          <div class="result-section"><div class="result-title">Kemungkinan Interpretasi</div><div class="result-body"><ul style="list-style:none;display:flex;flex-direction:column;gap:8px;">${interpretations.map(i => `<li>• ${i.text} <span class="badge badge-${i.conf.toLowerCase()}">${i.conf} Keyakinan</span></li>`).join('')}</ul></div></div>
          <div class="result-section"><div class="result-title">Apa yang Tidak Bisa Kita Ketahui</div><div class="result-body">Ekspresi wajah pasti mereka, keadaan emosional, atau apa yang mereka lakukan saat mengetik ini.</div></div>
          <div class="result-section"><div class="result-title">Apa yang Tidak Boleh Diasumsikan</div><div class="result-body">Jangan berasumsi mereka diam-diam marah atau ingin putus hanya karena singkatnya pesan.</div></div>
          <div class="result-section"><div class="result-title">Balasan yang Disarankan</div><div class="result-body">
            <div class="script-box"><span class="script-text"><strong>Santai:</strong> "${casual}"</span><button class="btn btn-copy" onclick="copyToClipboard('${casual}')">Salin</button></div>
            <div class="script-box"><span class="script-text"><strong>Hangat:</strong> "${warm}"</span><button class="btn btn-copy" onclick="copyToClipboard('${warm}')">Salin</button></div>
            <div class="script-box"><span class="script-text"><strong>Beri Ruang:</strong> "${space}"</span><button class="btn btn-copy" onclick="copyToClipboard('${space}')">Salin</button></div>
          </div></div>
          <div class="result-section" style="background:#FAF5FF;padding:16px;border-radius:12px;">

      const hurtMe = document.getElementById('ffHurtMe').value || "merasa tidak didengar";
      const hurtThem = document.getElementById('ffHurtThem').value || "merasa disalahkan";
      const textScript = "Hei, aku kesal bagaimana kita meninggalkan semuanya tadi. Aku bereaksi karena frustrasi karena aku bersemangat bertemu kamu, tapi aku seharusnya tidak marah. Mari kita reset saat kamu siap?";
      const talkScript = "Hei, saat kamu senggang, aku ingin duduk dan membicarakan apa yang terjadi dengan tenang. Aku sangat menghargai kita dan ingin memahami sudut pandangmu.";
      const html = `
        <div class="card output-card">
          <div class="result-section"><div class="result-title">Tentang Apa Sebenarnya Pertengkaran Ini</div><div class="result-body">Pertengkaran ini bukan hanya tentang peristiwa permukaan—itu adalah benturan antara kebutuhanmu akan koneksi dan kebutuhan mereka akan keanggunan pribadi/mengisi ulang energi.</div></div>
          <div class="result-section"><div class="result-title">Apa yang Mungkin Kamu Butuhkan</div><div class="result-body"><strong>Dibingkai Ulang:</strong> Kepastian, waktu berkualitas, dan merasa diprioritaskan dalam jadwal mereka (${hurtMe}).</div></div>
          <div class="result-section"><div class="result-title">Apa yang Mungkin Mereka Butuhkan</div><div class="result-body"><strong>Dibingkai Ulang:</strong> Pengertian, kelegaan dari tekanan, dan kebebasan untuk beristirahat (${hurtThem}).</div></div>
          <div class="result-section"><div class="result-title">Bagianmu yang Harus Diakui</div><div class="result-body">Akui cara kamu bereaksi di bawah tekanan tanpa membatalkan perasaan intimu. (misalnya, menggunakan istilah absolut seperti "kamu tidak pernah" atau menggunakan diam sebagai hukuman).</div></div>
          <div class="result-section"><div class="result-title">Pesan Perbaikan (Teks)</div><div class="result-body"><div class="script-box"><span class="script-text">"${textScript}"</span><button class="btn btn-copy" onclick="copyToClipboard('${textScript}')">Salin</button></div></div></div>
          <div class="result-section"><div class="result-title">Jika Kamu Ingin Bicara Langsung</div><div class="result-body"><div class="script-box"><span class="script-text">"${talkScript}"</span><button class="btn btn-copy" onclick="copyToClipboard('${talkScript}')">Salin</button></div></div></div>
          <div class="result-section"><div class="result-title">Jika Kamu Butuh Ruang Dulu</div><div class="result-body">Tidak apa-apa untuk menunggu! Kirim pesan singkat: <em>"Aku ingin membicarakan ini, tapi aku perlu satu jam untuk menjernihkan pikiran dulu agar kita bisa bicara dengan tenang."</em></div></div>
        </div>
      `;
      document.getElementById('fightOutput').innerHTML = html;
      setHistory('fight-fixer', { summary: 'Rencana Perbaikan Pertengkaran' });
    }

    /* ===== RESET 7 HARI ===== */
    let resetDays = JSON.parse(localStorage.getItem('flg_reset_days') || '{"day":0}');
    function renderReset() {
      return `
        <div class="card">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Reset Cinta Pertama 7 Hari</h2>
          <p style="color:#718096;font-size:14px;margin-bottom:20px;">Perjalanan terpandu melalui kelima alat untuk membangun kejelasan dan rencana.</p>
          <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.5rem;">
            <span class="reset-day" id="resetDay1">Hari 1: Dekoder</span>
            <span class="reset-day" id="resetDay2">Hari 2: Haruskah Mengetik</span>
            <span class="reset-day" id="resetDay3">Hari 3: Pembicaraan</span>
            <span class="reset-day" id="resetDay4">Hari 4: Kecemburuan</span>
            <span class="reset-day" id="resetDay5">Hari 5: Perbaiki</span>
            <span class="reset-day" id="resetDay6">Hari 6: Sintesis</span>
            <span class="reset-day" id="resetDay7">Hari 7: Rencana</span>
          </div>
          <div id="resetContent">
            <p style="color:#718096;">Mulai dengan Hari 1: Dekoder Pesan. Selesaikan setiap alat secara berurutan untuk membangun Rencana Hubunganmu.</p>
            <button class="btn btn-primary" onclick="startReset()"><i class="fa-solid fa-play"></i> Mulai Hari 1</button>
          </div>
          <div id="resetPlanOutput" class="output-card" style="margin-top:1.5rem;">
            <div class="result-section"><div class="result-title"><i class="fa-solid fa-list-check"></i> Rencana Hubunganmu</div></div>
            <div id="resetPlanContent"></div>
          </div>
        </div>
      `;
    }

    function startReset() {
      const day = resetDays.day || 0;
      const tools = ['text-decoder','should-text','the-talk','jealousy-reset','fight-fixer'];
      const labelMap = ['Dekoder Pesan','Haruskah Aku Mengetik','Pembicaraan','Reset Kecemburuan','Perbaiki Pertengkaran'];
      if (day < 5) {
        switchTool(tools[day]);
        showToast(`Memulai Hari ${day+1}: ${labelMap[day]}`);
        resetDays.day = day + 1;
        localStorage.setItem('flg_reset_days', JSON.stringify(resetDays));
      } else if (day === 5) {
        synthesizeReset();
        resetDays.day = 6;
        localStorage.setItem('flg_reset_days', JSON.stringify(resetDays));
      } else if (day === 6) {
        showToast('Reset selesai! Lihat rencanamu di Rencana Hubunganku.');
        switchTool('plan');
      }
      updateResetUI();
    }

    function synthesizeReset() {
      const plan = {
        decoder: getHistory('text-decoder')[0]?.data || {},
        should: getHistory('should-text')[0]?.data || {},
        talk: getHistory('the-talk')[0]?.data || {},
        jealousy: getHistory('jealousy-reset')[0]?.data || {},
        fight: getHistory('fight-fixer')[0]?.data || {}
      };
      document.getElementById('resetPlanContent').innerHTML = `
        <div class="two-col">
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kuperhatikan</strong><br>${plan.decoder.summary || 'Renungkan pola komunikasimu.'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kuinginkan</strong><br>${plan.talk.summary || 'Renungkan tujuan hubunganmu.'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kutakuti</strong><br>${plan.jealousy.summary || 'Renungkan ketakutanmu.'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Bagaimana Aku Ingin Memperbaiki</strong><br>${plan.fight.summary || 'Renungkan pendekatan perbaikanmu.'}</div>
        </div>
        <div style="margin-top:16px;padding:16px;background:#FAF5FF;border-radius:12px;"><strong>Tindakan Pertamaku:</strong> Pilih satu: amati, komunikasikan, tenangkan, atau perbaiki. Tinjau dalam 30 hari.</div>
      `;
      document.getElementById('resetPlanOutput').style.display = 'block';
      setHistory('reset', { summary: 'Reset Cinta Pertama 7 Hari Selesai' });
      updateFriendshipPlan();
    }

    function updateResetUI() {
      const day = resetDays.day || 0;
      for (let i=1; i<=7; i++) {
        const el = document.getElementById(`resetDay${i}`);
        if (el) el.classList.toggle('done', i <= day);
      }
      const content = document.getElementById('resetContent');
      if (day === 0) content.innerHTML = '<p style="color:#718096;">Mulai dengan Hari 1: Dekoder Pesan. Selesaikan setiap alat secara berurutan untuk membangun Rencana Hubunganmu.</p><button class="btn btn-primary" onclick="startReset()"><i class="fa-solid fa-play"></i> Mulai Hari 1</button>';
      else if (day < 5) content.innerHTML = `<p>Hari ${day+1} dari 7: Selesaikan ${['Dekoder Pesan','Haruskah Aku Mengetik?','Pembicaraan','Reset Kecemburuan','Perbaiki Pertengkaran'][day]}.</p><button class="btn btn-primary" onclick="startReset()"><i class="fa-solid fa-arrow-right"></i> Lanjutkan</button>`;
      else if (day === 5) content.innerHTML = `<p>Kamu telah menyelesaikan semua alat. Siap untuk mensintesis Rencana Hubunganmu?</p><button class="btn btn-primary" onclick="startReset()"><i class="fa-solid fa-list-check"></i> Sintesis Rencana</button>`;
      else if (day === 6) content.innerHTML = `<p>✅ Reset selesai. Lihat rencanamu di Rencana Hubunganku.</p><button class="btn btn-secondary" onclick="switchTool('plan')">Lihat Rencana</button>`;
    }

    /* ===== RENCANA HUBUNGAN ===== */
    function renderPlan() {
      return `
        <div class="card">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Rencana Hubungan Cinta Pertamaku</h2>
          <p style="color:#718096;font-size:14px;margin-bottom:20px;">Disintesis dari alat yang telah kamu selesaikan.</p>
          <div id="planDisplay"><p style="color:#718096;">Selesaikan Reset Cinta Pertama 7 Hari atau jalankan alat individu untuk membangun rencanamu.</p></div>
        </div>
      `;
    }

    function updateFriendshipPlan() {
      const container = document.getElementById('planDisplay');
      if (!container) return;
      const d = getHistory('text-decoder')[0]?.data || {};
      const s = getHistory('should-text')[0]?.data || {};
      const t = getHistory('the-talk')[0]?.data || {};
      const j = getHistory('jealousy-reset')[0]?.data || {};
      const f = getHistory('fight-fixer')[0]?.data || {};
      const hasData = Object.keys(d).length || Object.keys(s).length || Object.keys(t).length || Object.keys(j).length || Object.keys(f).length;
      if (!hasData) {
        container.innerHTML = '<p style="color:#718096;">Selesaikan Reset Cinta Pertama 7 Hari atau jalankan alat individu untuk membangun rencanamu.</p>';
        return;
      }
      container.innerHTML = `
        <div class="two-col">
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kuperhatikan</strong><br>${d.summary || '—'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kuinginkan</strong><br>${t.summary || '—'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Apa yang Kutakuti</strong><br>${j.summary || '—'}</div>
          <div style="background:#F8FAFC;padding:12px;border-radius:8px;"><strong>Bagaimana Aku Ingin Memperbaiki</strong><br>${f.summary || '—'}</div>
        </div>
        <div style="margin-top:16px;padding:16px;background:#FAF5FF;border-radius:12px;"><strong>Tindakan Pertamaku:</strong> Pilih satu: amati, komunikasikan, tenangkan, atau perbaiki. Tinjau dalam 30 hari.</div>
      `;
    }

    /* ===== TAMPILAN RIWAYAT ===== */
    function renderHistoryView() {
      return `
        <div class="card">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Riwayatku</h2>
          <p style="color:#718096;font-size:14px;margin-bottom:20px;">Semua refleksi tersimpanmu dalam satu tempat.</p>
          <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;">
            <button class="btn btn-secondary btn-sm" onclick="renderAllHistory()">Segarkan</button>
            <button class="btn btn-secondary btn-sm" onclick="if(confirm('Hapus semua riwayat?')){clearAllHistory();}">Hapus Semua Riwayat</button>
          </div>
          <div id="allHistoryContainer"></div>
        </div>
      `;
    }

    function renderAllHistory() {
      const container = document.getElementById('allHistoryContainer');
      if (!container) return;
      const modules = ['text-decoder','should-text','the-talk','jealousy-reset','fight-fixer','reset'];
      const labelMap = {
        'text-decoder': 'Dekoder Pesan',
        'should-text': 'Haruskah Mengetik',
        'the-talk': 'Pembicaraan',
        'jealousy-reset': 'Reset Kecemburuan',
        'fight-fixer': 'Perbaiki Pertengkaran',
        'reset': 'Reset'
      };
      let html = '';
      modules.forEach(m => {
        const h = getHistory(m);
        if (!h.length) return;
        html += `<h4 style="margin:1rem 0 0.5rem;color:#9B5DE5;">${labelMap[m] || m}</h4>`;
        html += h.map(item => `
          <div class="history-item">
            <div class="history-timestamp">${item.timestamp}</div>
            <div><strong>${item.summary}</strong></div>
          </div>
        `).join('');
      });
      container.innerHTML = html || '<p style="color:#718096;">Tidak ada riwayat ditemukan.</p>';
    }

    /* ===== PRIVASI ===== */
    function renderPrivacy() {
      return `
        <div class="card">
          <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Privasi & Keamanan</h2>
          <p style="color:#718096;font-size:14px;margin-bottom:20px;">Datamu tetap di perangkatmu.</p>
          <p><strong>Dirancang untuk privasi.</strong> Refleksimu tetap ada di perangkatmu. Kami tidak mengirimkan data ke server mana pun.</p>
          <p style="margin-top:1rem;"><strong>Penting:</strong> Panduan Cinta Pertama adalah alat bantu refleksi dan komunikasi mandiri. Ini bukan terapi, diagnosis, intervensi krisis, atau konseling hubungan profesional.</p>
          <p style="margin-top:1rem;">Jika hubungan melibatkan ancaman, paksaan, penguntitan, pelecehan, kekerasan atau situasi lain di mana komunikasi langsung dapat meningkatkan bahaya, jangan gunakan latihan ini sebagai rencana keselamatan utama. Utamakan keselamatan dan dukungan profesional yang tepat.</p>
          <p style="margin-top:1rem;"><i class="fa-solid fa-triangle-exclamation" style="color:#9B5DE5;"></i> Jangan pernah menghadapi orang yang berbahaya berdasarkan naskah yang dihasilkan.</p>
        </div>
      `;
    }

    /* ===== INISIALISASI ===== */
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTool(btn.dataset.tool));
      });
      renderTool('dashboard');
      updateResetUI();
      updateFriendshipPlan();
    });
  </script>
</body>
</html>
